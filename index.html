<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <script src="./TaskManager.js" defer></script>
    <title>TaskManagementApp</title>

</head>

<body>

    <h1>Task Manager</h1>

    <label for="item-inputtask">Enter Task Name :</label>
    <input type="text" id="item-inputtask" placeholder="Enter Task Name">
    
    <label for="item-inputcategory">Enter Category Name :</label>
    <input type="text" id="item-inputcategory" placeholder="Enter Category">
    
    <label for="item-deadline">Select Deadline:</label>
    <input type="date" id="item-deadline" required>
    
    <label for="item-inputstatus">Select Status:</label>
    <select id="item-inputstatus">

        <option value="In Progress" selected>In Progress</option>
        <option value="Completed">Completed</option>

    </select>

    <button id="addTask-btn">Add Task</button>
